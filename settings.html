<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - AI T&C Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container settings-container">
    <header>
      <div class="header-nav">
        <button id="back-btn" class="icon-button" title="Back to main">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/>
          </svg>
        </button>
        <div>
          <h1>Settings</h1>
          <p class="subtitle">Configure your preferences</p>
        </div>
      </div>
    </header>
    
    <main class="settings-main">
      <!-- API Key Section -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="icon">🔑</span>
          API Key Management
        </h2>
        <div class="setting-item">
          <label for="settings-api-key-input">OpenAI API Key:</label>
          <div class="input-group">
            <input type="password" id="settings-api-key-input" placeholder="sk-..." class="api-key-input">
            <button id="settings-show-key-btn" class="show-key-btn" type="button">👁️</button>
          </div>
          <p class="setting-description">Your API key is stored securely in your browser.</p>
        </div>
        <div class="button-group">
          <button id="update-key-btn" class="primary-button">Update API Key</button>
          <button id="remove-key-btn" class="danger-button">Remove API Key</button>
        </div>
      </section>
      
      <!-- Model Selection Section -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="icon">🤖</span>
          AI Model Selection
        </h2>
        <div class="setting-item">
          <label for="model-select">Select Model:</label>
          <select id="model-select" class="model-select">
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Fast & Affordable)</option>
            <option value="gpt-4">GPT-4 (Most Capable)</option>
            <option value="gpt-4-turbo">GPT-4 Turbo (Balanced)</option>
            <option value="gpt-4o">GPT-4o (Newest)</option>
            <option value="gpt-4o-mini">GPT-4o Mini (Efficient)</option>
          </select>
          <div id="model-info" class="model-info"></div>
        </div>
      </section>
      
      <!-- About Section -->
      <section class="settings-section">
        <h2 class="section-title">
          <span class="icon">ℹ️</span>
          About
        </h2>
        <div class="about-content">
          <p><strong>AI T&C Analyzer</strong></p>
          <p>Version 1.0.0</p>
          <p class="setting-description">Analyze Terms and Conditions using AI to provide summaries and trustworthiness ratings.</p>
        </div>
      </section>
    </main>
    
    <footer>
      <p class="footer-text">Powered by OpenAI</p>
    </footer>
  </div>
  
  <script src="settings.js"></script>
</body>
</html>
